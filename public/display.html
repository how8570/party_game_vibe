<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyGround</title>
<style>
  :root { --bg: #0e0e10; --panel: #18181c; --fg: #f2f2f2; --muted: #8a8a92; --accent: #ffd740; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  .scene { position: fixed; inset: 0; }

  /* ---------- top bar ---------- */
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 16px; font-size: 13px; color: var(--muted); z-index: 10; pointer-events: none; }
  #bar b { color: var(--fg); font-weight: 600; }
  #bar .sp { flex: 1; }
  #conn.off { color: #ff5252; }

  /* ---------- lobby: the map fills the screen, everything else floats on top ---------- */
  #lobby { display: block; }
  .arena { position: absolute; inset: 0; background: #121216; overflow: hidden; }
  .arena canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .join { position: absolute; top: 56px; left: 20px; width: 232px; background: rgba(24,24,28,0.88); backdrop-filter: blur(8px); border: 1px solid #2a2a32; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; z-index: 2; }
  .join img { width: 170px; height: 170px; background: #fff; border-radius: 10px; padding: 6px; }
  .join h1 { font-size: 17px; margin: 0; }
  .join .url { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #40c4ff; word-break: break-all; }
  .join .hint { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .roster { position: absolute; inset: 0; pointer-events: none; }
  .roster h2 { position: absolute; top: 56px; right: 20px; margin: 0; font-size: 18px; display: flex; align-items: baseline; gap: 12px; z-index: 2; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .roster h2 span { color: #c9c3e6; font-size: 14px; font-weight: 400; }
  .roster h2 .tip { font-size: 12px; }
  .actions { position: absolute; left: 20px; bottom: 20px; display: flex; gap: 12px; align-items: center; z-index: 2; pointer-events: auto; }
  .primary { font-size: 20px; font-weight: 800; padding: 14px 30px; border-radius: 14px; border: 0; background: var(--accent); color: #000; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  .primary:disabled { background: #2a2a30; color: #666; cursor: default; }
  .ghost { font-size: 14px; padding: 10px 16px; border-radius: 10px; border: 1px solid #444; background: rgba(0,0,0,0.5); color: #ccc; }
  .msg { color: #ffd1a8; font-size: 14px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

  /* ---------- duel ---------- */
  #duel { display: grid; grid-template-columns: 1fr 1fr; }
  .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 40px; position: relative; transition: background 200ms; }
  .side.left { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 18%, transparent), transparent); }
  .side.right { background: linear-gradient(270deg, color-mix(in srgb, var(--c) 18%, transparent), transparent); }
  .side .pname { font-size: 56px; font-weight: 900; color: var(--c); line-height: 1; text-align: center; }
  .side .wins { font-size: 18px; color: var(--muted); }
  .side .status { font-size: 24px; min-height: 32px; color: var(--muted); text-align: center; }
  .side .status.ok { color: #69f0ae; }
  .side .react { font-size: 72px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; min-height: 80px; }
  .side .react small { font-size: 24px; color: var(--muted); font-weight: 600; }
  .side.winner { background: color-mix(in srgb, var(--c) 35%, transparent); }
  .side.loser { opacity: 0.45; }
  .gun { width: 140px; height: 140px; transition: transform 150ms; }
  .gun svg { width: 100%; height: 100%; }
  .side.right .gun { transform: scaleX(-1); }
  .gun.holstered { transform: rotate(80deg); }
  .side.right .gun.holstered { transform: scaleX(-1) rotate(80deg); }
  #center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; gap: 10px; }
  #center .big { font-size: 64px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 4px 30px rgba(0,0,0,0.6); }
  #center .sub { font-size: 22px; color: var(--muted); }
  #center .round { position: absolute; top: 56px; font-size: 16px; color: var(--muted); letter-spacing: 3px; }
  #center .vs { font-size: 40px; font-weight: 900; color: #444; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; }
  #flash.on { animation: flash 500ms ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #fireword { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 180px; font-weight: 900; color: #ff5252; letter-spacing: 8px; pointer-events: none; z-index: 21; opacity: 0; text-shadow: 0 0 60px #ff5252; }
  #fireword.on { animation: fireword 900ms ease-out; }
  @keyframes fireword { 0% { opacity: 1; transform: scale(1.6); } 60% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
  .duelbar { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: linear-gradient(transparent, rgba(0,0,0,0.6)); font-size: 14px; color: var(--muted); }
  .duelbar .queue { display: flex; gap: 8px; align-items: center; flex: 1; overflow: hidden; }
  .duelbar .q { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--c); color: var(--c); white-space: nowrap; }
  .duelbar .q.first { background: var(--c); color: #000; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ---------- bumper ---------- */
  #bumper { background: #0d0a1a; }
  #ring { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bhud { position: absolute; top: 56px; left: 24px; right: 24px; display: flex; align-items: baseline; gap: 24px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .bround { font-size: 22px; font-weight: 900; color: #ffd740; letter-spacing: 2px; }
  .btime { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }
  .btime.low { color: #ff5252; }
  .balive { margin-left: auto; font-size: 16px; color: #c9c3e6; }
  .bbanner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 72px; font-weight: 900; text-shadow: 0 6px 40px rgba(0,0,0,0.8); pointer-events: none; }
  .bbanner small { font-size: 22px; font-weight: 600; color: #ddd; }
  .bbanner .rank { font-size: 18px; color: #bbb; font-weight: 500; }

  /* ---------- parkour ---------- */
  #parkour { background: #0b0f2a; }
  #course { position: absolute; inset: 0; width: 100%; height: 100%; }
  .progress { position: absolute; top: 96px; left: 40px; right: 40px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; }
  .progress .dot { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.6); transition: left 120ms linear; }
  .progress .flag { position: absolute; right: -14px; top: -14px; font-size: 20px; }

  /* ---------- debug overlay ---------- */
  #debug { position: fixed; inset: 44px 0 0 0; background: rgba(10,10,12,0.96); z-index: 30; overflow: auto; padding: 16px; display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-content: start; }
  .card { background: var(--panel); border-radius: 14px; padding: 14px; border: 2px solid var(--c, #444); display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
  .card.off { opacity: 0.4; filter: grayscale(1); }
  .card .title { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .card .title .num { background: var(--c); color: #000; border-radius: 6px; padding: 1px 8px; font-size: 14px; }
  .card .title .hz { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .card canvas { width: 150px; height: 150px; display: block; background: #0b0b0d; border-radius: 10px; }
  .card .info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card .dir { font-size: 30px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
  .card .gesture { font-size: 22px; font-weight: 800; color: #ffd740; min-height: 26px; }
  .card .gesture.flashg { animation: pop 0.7s ease-out; }
  @keyframes pop { 0% { transform: scale(1.6); opacity: 1; } 100% { transform: scale(1); opacity: 0.9; } }
  .bars { display: grid; grid-template-columns: 14px 1fr; gap: 4px 6px; align-items: center; font-size: 11px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .bar { height: 8px; background: #222; border-radius: 4px; position: relative; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 50%; background: var(--c); }
  .bar.mag i { left: 0; background: #ffd740; }
  .btns { display: flex; gap: 8px; margin-top: 2px; }
  .btn { width: 36px; height: 36px; border-radius: 8px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #666; }
  .btn.down { background: var(--c); color: #000; border-color: var(--c); }
  .raw { grid-column: 1 / -1; font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--muted); white-space: pre; }
  aside h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  .ev { padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; background: #141418; display: flex; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .ev .t { color: #555; }
  .ev .p { font-weight: 700; }
</style>
</head>
<body>

<div id="bar">
  <b>PartyGround</b>
  <span id="conn">連線中…</span>
  <span id="count"></span>
  <span class="sp"></span>
  <span>快捷鍵：<b>Enter</b> 直接開始 · <b>Esc</b> 結束 · <b>D</b> 輸入檢視</span>
</div>

<!-- ---------- LOBBY ---------- -->
<section id="lobby" class="scene">
  <div class="arena"><canvas id="arena"></canvas></div>
  <div class="join">
    <h1>用手機掃描加入</h1>
    <img id="qr" src="/qr.svg" alt="QR">
    <div class="url" id="url">…</div>
    <div class="hint">手機與這台電腦連同一個 Wi-Fi。第一次開啟會看到憑證警告，選「進階 → 繼續前往」。</div>
  </div>
  <div class="roster">
    <h2>大廳 <span id="rosterCount">0 位在線</span><span class="tip">手機橫拿 ◀ ▶ 跑、「跳」跳 · 走進遊戲區就開始</span></h2>
    <div class="actions">
      <button id="startBtn" class="primary" disabled>直接開始</button>
      <button class="ghost gameBtn" data-game="quickdraw" title="快捷鍵 1">快槍手</button>
      <button class="ghost gameBtn" data-game="bumper" title="快捷鍵 2">碰碰車</button>
      <button class="ghost gameBtn" data-game="parkour" title="快捷鍵 3">跑酷</button>
      <button id="addBotBtn" class="ghost">＋ 機器人</button>
      <button id="removeBotBtn" class="ghost">－ 機器人</button>
      <button id="resetBtn" class="ghost">清除離線玩家</button>
      <span class="msg" id="lobbyMsg"></span>
    </div>
  </div>
</section>

<!-- ---------- DUEL ---------- -->
<section id="duel" class="scene hidden">
  <div class="side left" id="sideA">
    <div class="gun" id="gunA"></div>
    <div class="pname"></div>
    <div class="wins"></div>
    <div class="status"></div>
    <div class="react"></div>
  </div>
  <div class="side right" id="sideB">
    <div class="gun" id="gunB"></div>
    <div class="pname"></div>
    <div class="wins"></div>
    <div class="status"></div>
    <div class="react"></div>
  </div>
  <div id="center">
    <div class="round" id="round"></div>
    <div class="vs" id="vs">VS</div>
    <div class="big" id="big"></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="duelbar">
    <div class="queue" id="queue"></div>
    <button id="skipBtn" class="ghost">跳過這場</button>
    <button id="stopBtn" class="ghost">結束回大廳</button>
  </div>
</section>
<div id="flash"></div>
<div id="fireword">FIRE!</div>

<!-- ---------- BUMPER ---------- -->
<section id="bumper" class="scene hidden">
  <canvas id="ring"></canvas>
  <div class="bhud">
    <div class="bround" id="bround">碰碰車</div>
    <div class="btime" id="btime"></div>
    <div class="balive" id="balive"></div>
  </div>
  <div class="bbanner hidden" id="bbanner"></div>
  <div class="duelbar">
    <div class="queue">推人出圈，最後站著的人贏。15 秒後圈會開始縮小。</div>
    <button id="bskipBtn" class="ghost">結束這場</button>
    <button id="bstopBtn" class="ghost">回大廳</button>
  </div>
</section>

<!-- ---------- PARKOUR ---------- -->
<section id="parkour" class="scene hidden">
  <canvas id="course"></canvas>
  <div class="bhud">
    <div class="bround" id="pround">跑酷</div>
    <div class="btime" id="ptime"></div>
    <div class="balive" id="pleft"></div>
  </div>
  <div class="progress" id="pprogress"></div>
  <div class="bbanner hidden" id="pbanner"></div>
  <div class="duelbar">
    <div class="queue">衝到終點，掉下去會回到檢查點。先到的贏，沒到的看跑多遠。</div>
    <button id="pskipBtn" class="ghost">結束這場</button>
    <button id="pstopBtn" class="ghost">回大廳</button>
  </div>
</section>

<!-- ---------- DEBUG OVERLAY ---------- -->
<section id="debug" class="hidden">
  <div id="cards"></div>
  <aside><h2>事件</h2><div id="events"></div></aside>
</section>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let state = { players: [], game: { mode: 'lobby', duel: null, queue: [] } };
  let ws, backoff = 500;

  // ---------- audio (synthesized, unlocked by the first click/keypress) ----------
  let ac = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(freq, dur, type = 'sine', gain = 0.2, when = 0) {
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, c.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + when + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + when); o.stop(c.currentTime + when + dur + 0.05);
  }
  function gunshot() {
    const c = audio(); if (!c) return;
    const len = 0.35, buf = c.createBuffer(1, c.sampleRate * len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800;
    const g = c.createGain(); g.gain.value = 0.9;
    src.connect(f).connect(g).connect(c.destination); src.start();
    tone(70, 0.4, 'square', 0.3);
  }
  const sfx = {
    intro: () => { tone(330, 0.12, 'triangle', 0.25); tone(440, 0.12, 'triangle', 0.25, 0.15); },
    holstered: () => tone(880, 0.08, 'sine', 0.15),
    ready: () => tone(220, 0.5, 'sine', 0.12),
    fire: () => gunshot(),
    win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.22, i * 0.11)); },
    fail: () => { tone(200, 0.3, 'sawtooth', 0.15); tone(150, 0.4, 'sawtooth', 0.15, 0.2); },
    bump: (force) => { const c = audio(); if (!c) return; const g = Math.min(0.5, 0.08 + (force || 0) * 0.03); tone(120 + Math.random() * 60, 0.08, 'square', g); },
    dash: () => { const c = audio(); if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(300, c.currentTime); o.frequency.exponentialRampToValueAtTime(900, c.currentTime + 0.15); g.gain.setValueAtTime(0.12, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.2); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + 0.25); },
    out: () => { const c = audio(); if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(600, c.currentTime); o.frequency.exponentialRampToValueAtTime(120, c.currentTime + 0.5); g.gain.setValueAtTime(0.25, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.55); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + 0.6); },
  };
  document.addEventListener('pointerdown', audio, { once: true });
  document.addEventListener('keydown', audio, { once: true });

  // ---------- websocket ----------
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function cmd(c) { send({ t: 'cmd', cmd: c }); }
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
    ws.onopen = () => { backoff = 500; send({ t: 'hello', role: 'display' }); $('#conn').textContent = '已連線'; $('#conn').className = ''; };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'state') { state = m; if (m.joinUrl) $('#url').textContent = m.joinUrl; }
      else if (m.t === 'event') logEvent(m);
      else if (m.t === 'fire') onFire();
      else if (m.t === 'bumper:bump') { bumps.push({ x: m.x, y: m.y, at: Date.now(), force: m.force }); sfx.bump(m.force); }
      else if (m.t === 'bumper:dash') sfx.dash();
      else if (m.t === 'bumper:out') sfx.out();
      else if (m.t === 'parkour:checkpoint') sfx.holstered();
      else if (m.t === 'parkour:fall') sfx.out();
      else if (m.t === 'parkour:finish') { if (m.place === 1) sfx.win(); else sfx.intro(); }
    };
    ws.onclose = () => { $('#conn').textContent = '斷線，重連中…'; $('#conn').className = 'off'; setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 5000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  connect();

  // ---------- controls ----------
  $('#startBtn').addEventListener('click', () => cmd('start'));
  $('#resetBtn').addEventListener('click', () => cmd('reset'));
  $('#addBotBtn').addEventListener('click', () => cmd('addbot'));
  $('#removeBotBtn').addEventListener('click', () => cmd('removebot'));
  $('#stopBtn').addEventListener('click', () => cmd('stop'));
  $('#skipBtn').addEventListener('click', () => cmd('skip'));
  const startGame = (id) => send({ t: 'cmd', cmd: 'start', game: id });
  for (const b of document.querySelectorAll('.gameBtn')) b.addEventListener('click', () => startGame(b.dataset.game));
  const GAME_KEYS = { 1: 'quickdraw', 2: 'bumper', 3: 'parkour' };
  document.addEventListener('keydown', (e) => {
    if (GAME_KEYS[e.key] && state.game.mode === 'lobby') { startGame(GAME_KEYS[e.key]); return; }
    if (e.key === 'Enter' && state.game.mode === 'lobby') cmd('start');
    else if (e.key === 'Escape' && state.game.mode !== 'lobby') cmd('stop');
    else if (e.key === 'd' || e.key === 'D') $('#debug').classList.toggle('hidden');
  });

  // ---------- fire moment ----------
  function onFire() {
    sfx.fire();
    const f = $('#flash'), w = $('#fireword');
    f.classList.remove('on'); w.classList.remove('on'); void f.offsetWidth;
    f.classList.add('on'); w.classList.add('on');
  }

  // ---------- rendering ----------
  const GUN_SVG = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M8 38 H78 a6 6 0 0 1 6 6 v6 a6 6 0 0 1 -6 6 H46 l-6 26 H24 l6 -26 h-8 a6 6 0 0 1 -6 -6 v-4"/><path d="M36 56 l6 10"/><circle cx="18" cy="44" r="2" fill="currentColor"/></svg>`;
  $('#gunA').innerHTML = GUN_SVG; $('#gunB').innerHTML = GUN_SVG;

  // Lobby playground: 2D platformer. The server integrates physics; we interpolate and draw.
  const arena = $('#arena'), actx = arena.getContext('2d');
  const smooth = new Map(); // pid -> interpolated {x, y}
  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.7, r: Math.random() * 1.4 + 0.4, tw: Math.random() * 6 }));
  function hills(ctx, W, groundY, amp, freq, phase, color, height) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, groundY);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, groundY - height - Math.sin(x * freq + phase) * amp - Math.sin(x * freq * 2.7 + phase * 1.3) * amp * 0.4);
    ctx.lineTo(W, groundY); ctx.closePath(); ctx.fill();
  }
  function renderLobby() {
    const ps = state.players;
    const world = state.world || { w: 16, h: 9, platforms: [{ x: 0, y: 0, w: 16 }] };
    const box = arena.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const W = Math.max(1, Math.round(box.width)), H = Math.max(1, Math.round(box.height));
    if (arena.width !== W * dpr || arena.height !== H * dpr) { arena.width = W * dpr; arena.height = H * dpr; }
    actx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const now = Date.now(), t = now / 1000;
    const groundPad = 90;   // room for the ground slab and the action buttons
    const scale = Math.min(W / world.w, (H - groundPad - 90) / world.h);
    const ox = (W - world.w * scale) / 2, groundY = H - groundPad;
    const px = (x) => ox + x * scale, py = (y) => groundY - y * scale;

    // sky
    const sky = actx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0b0f2a'); sky.addColorStop(0.6, '#1a1540'); sky.addColorStop(1, '#2d1b4e');
    actx.fillStyle = sky; actx.fillRect(0, 0, W, H);
    for (const s of stars) {
      actx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 1.5 + s.tw);
      actx.fillStyle = '#fff'; actx.beginPath(); actx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); actx.fill();
    }
    actx.globalAlpha = 1;
    // moon
    actx.fillStyle = '#f5e6b8'; actx.beginPath(); actx.arc(W * 0.82, H * 0.16, 26, 0, Math.PI * 2); actx.fill();
    actx.fillStyle = '#1a1540'; actx.beginPath(); actx.arc(W * 0.82 - 10, H * 0.16 - 6, 22, 0, Math.PI * 2); actx.fill();
    // parallax hills (2.5D depth)
    hills(actx, W, groundY, 26, 0.006, t * 0.05, '#221a4d', 150);
    hills(actx, W, groundY, 34, 0.01, 1.7 + t * 0.09, '#2b2160', 90);
    hills(actx, W, groundY, 20, 0.018, 3.1 + t * 0.14, '#352a70', 40);

    // platforms with a lit top face and a dark front face
    const thick = 0.42 * scale;
    for (const pl of world.platforms) {
      const x = px(pl.x), y = py(pl.y), w = pl.w * scale;
      const isGround = pl.y === 0 && pl.w >= world.w;
      actx.fillStyle = isGround ? '#3b2d63' : '#4a3a7a';
      actx.beginPath(); actx.roundRect(isGround ? 0 : x, y, isGround ? W : w, isGround ? groundPad + 2 : thick, isGround ? 0 : 8); actx.fill();
      actx.fillStyle = isGround ? '#8e78d0' : '#a08ae0';
      actx.beginPath(); actx.roundRect(x, y, w, 7, isGround ? 0 : [8, 8, 0, 0]); actx.fill();
      if (!isGround) { actx.fillStyle = 'rgba(0,0,0,0.25)'; actx.fillRect(x + 6, y + thick, w - 12, 6); }
    }

    // game zones on the ground
    for (const g of state.game.games || []) {
      const x0 = px(g.zone.x0), x1 = px(g.zone.x1), gy = py(g.zone.y || 0);
      const col = g.comingSoon ? '#6b6b7a' : '#ffd740';
      const glow = actx.createLinearGradient(0, gy - 60, 0, gy);
      glow.addColorStop(0, 'rgba(255,215,64,0)'); glow.addColorStop(1, g.comingSoon ? 'rgba(120,120,140,0.18)' : 'rgba(255,215,64,0.28)');
      actx.fillStyle = glow; actx.fillRect(x0, gy - 60, x1 - x0, 60);
      actx.fillStyle = col; actx.fillRect(x0, gy, x1 - x0, 7);
      // posts
      for (const x of [x0, x1]) { actx.fillStyle = col; actx.fillRect(x - 3, gy - 44, 6, 44); actx.beginPath(); actx.arc(x, gy - 46, 6, 0, Math.PI * 2); actx.fill(); }
      // label
      actx.textAlign = 'center'; actx.textBaseline = 'bottom';
      actx.font = '900 18px system-ui, "Noto Sans TC", sans-serif'; actx.fillStyle = col;
      actx.fillText(g.name, (x0 + x1) / 2, gy - 58);
      actx.font = '600 12px system-ui, "Noto Sans TC", sans-serif'; actx.fillStyle = g.comingSoon ? '#8a8a9a' : '#fff';
      let sub;
      if (g.comingSoon) sub = '即將推出';
      else if (g.countdown != null) sub = `${Math.ceil(g.countdown / 1000)} 秒後開始 · ${g.occupants.length}/${g.max}`;
      else if (g.occupants.length === 0) sub = g.min === 2 && g.max === 2 ? '走進來 1 對 1' : `走進來，${g.min} 人以上開始`;
      else sub = `${g.occupants.length}/${g.min} 人 · 還差 ${Math.max(0, g.min - g.occupants.length)} 位`;
      actx.fillText(sub, (x0 + x1) / 2, gy - 42);
      // hold progress of whoever is standing inside
      if (!g.comingSoon && g.occupants.length) {
        const prog = Math.min(...g.occupants.map((o) => o.progress));
        actx.fillStyle = 'rgba(255,255,255,0.15)'; actx.fillRect(x0 + 10, gy - 36, x1 - x0 - 20, 4);
        actx.fillStyle = col; actx.fillRect(x0 + 10, gy - 36, (x1 - x0 - 20) * prog, 4);
      }
    }

    const seen = new Set();
    const sorted = [...ps].filter((p) => p.connected).sort((a, b) => a.pos.x - b.pos.x);
    const bw = 0.8 * scale, bh = 1.0 * scale;
    for (const p of sorted) {
      seen.add(p.pid);
      let s = smooth.get(p.pid);
      if (!s) { s = { x: p.pos.x, y: p.pos.y }; smooth.set(p.pid, s); }
      s.x += (p.pos.x - s.x) * 0.5; s.y += (p.pos.y - s.y) * 0.5;
      const x = px(s.x), feet = py(s.y);
      // squash on landing, stretch while rising
      let sx = 1, sy = 1;
      const land = (now - p.landedAt) / 180;
      if (land >= 0 && land < 1) { const k = Math.sin(land * Math.PI); sx = 1 + 0.3 * k; sy = 1 - 0.3 * k; }
      else if (!p.onGround && p.vel.y > 3) { sx = 0.88; sy = 1.14; }
      // drop shadow on the surface below
      let shadowY = py(0);
      for (const pl of world.platforms) if (s.x >= pl.x - 0.3 && s.x <= pl.x + pl.w + 0.3 && pl.y <= s.y + 0.01 && py(pl.y) < shadowY) shadowY = py(pl.y);
      const height = Math.max(0, shadowY - feet);
      actx.fillStyle = `rgba(0,0,0,${0.35 * Math.max(0.2, 1 - height / 300)})`;
      actx.beginPath(); actx.ellipse(x, shadowY + 3, bw * 0.55 * Math.max(0.5, 1 - height / 400), 5, 0, 0, Math.PI * 2); actx.fill();
      // body
      actx.save();
      actx.translate(x, feet); actx.scale(sx, sy);
      actx.fillStyle = p.color;
      actx.beginPath(); actx.roundRect(-bw / 2, -bh, bw, bh, bw * 0.45); actx.fill();
      // feet
      actx.fillStyle = 'rgba(0,0,0,0.35)';
      const step = p.onGround && Math.abs(p.vel.x) > 0.5 ? Math.sin(t * 18) * 4 : 0;
      actx.beginPath(); actx.roundRect(-bw * 0.4, -5 + step, bw * 0.32, 6, 3); actx.fill();
      actx.beginPath(); actx.roundRect(bw * 0.08, -5 - step, bw * 0.32, 6, 3); actx.fill();
      // eyes facing the run direction
      const f = p.facing || 1;
      actx.fillStyle = '#fff';
      actx.beginPath(); actx.arc(f * 4 - 7, -bh * 0.68, 5, 0, Math.PI * 2); actx.fill();
      actx.beginPath(); actx.arc(f * 4 + 7, -bh * 0.68, 5, 0, Math.PI * 2); actx.fill();
      actx.fillStyle = '#111';
      actx.beginPath(); actx.arc(f * 6 - 7, -bh * 0.68, 2.6, 0, Math.PI * 2); actx.fill();
      actx.beginPath(); actx.arc(f * 6 + 7, -bh * 0.68, 2.6, 0, Math.PI * 2); actx.fill();
      // crown for the current champion
      if (state.game.champion === p.pid) {
        actx.fillStyle = '#ffd740';
        actx.beginPath(); actx.moveTo(-10, -bh - 2); actx.lineTo(-10, -bh - 14); actx.lineTo(-4, -bh - 7); actx.lineTo(0, -bh - 16); actx.lineTo(4, -bh - 7); actx.lineTo(10, -bh - 14); actx.lineTo(10, -bh - 2); actx.closePath(); actx.fill();
      }
      actx.restore();
      // name above head
      const top = feet - bh * sy;
      actx.font = '700 14px system-ui, "Noto Sans TC", sans-serif'; actx.textAlign = 'center'; actx.textBaseline = 'bottom';
      actx.fillStyle = 'rgba(0,0,0,0.5)'; actx.fillText(p.name, x + 1, top - 7 - (state.game.champion === p.pid ? 14 : 0) + 1);
      actx.fillStyle = '#fff'; actx.fillText(p.name, x, top - 7 - (state.game.champion === p.pid ? 14 : 0));
      // emoji bubble
      if (p.emoji) {
        const age = now - p.emoji.at, life = 2500;
        const a = age < 150 ? age / 150 : age > life - 400 ? Math.max(0, (life - age) / 400) : 1;
        const pop = age < 150 ? 0.6 + 0.4 * (age / 150) : 1;
        actx.save(); actx.globalAlpha = a;
        actx.translate(x, top - 62 - (state.game.champion === p.pid ? 14 : 0)); actx.scale(pop, pop);
        actx.fillStyle = '#fff';
        actx.beginPath(); actx.roundRect(-28, -28, 56, 52, 14); actx.fill();
        actx.beginPath(); actx.moveTo(-8, 24); actx.lineTo(8, 24); actx.lineTo(0, 34); actx.closePath(); actx.fill();
        actx.font = '34px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif'; actx.textAlign = 'center'; actx.textBaseline = 'middle'; actx.fillStyle = '#000';
        actx.fillText(p.emoji.e, 0, 1);
        actx.restore();
      }
    }
    for (const pid of smooth.keys()) if (!seen.has(pid)) smooth.delete(pid);
    if (!sorted.length) {
      actx.font = '600 20px system-ui, "Noto Sans TC", sans-serif'; actx.textAlign = 'center'; actx.textBaseline = 'middle'; actx.fillStyle = '#8f86b8';
      actx.fillText('還沒有人。掃左邊的 QR code 進來', W / 2, H * 0.45);
    }
    const online = sorted.length;
    $('#rosterCount').textContent = `${online} 位在線`;
    $('#startBtn').disabled = online < 2;
    $('#lobbyMsg').textContent = state.game.message || (online < 2 ? '至少需要兩位玩家' : '站進入口就會自動開始。Enter 會立刻開人最多的那個入口的遊戲，沒人站就開一場快槍手');
  }

  const PHASE_TEXT = {
    intro: ['', '準備對決'],
    holster: ['把手機垂在身側', '像槍收在槍套裡。兩人都就位後開始'],
    wait: ['', '等待槍聲…別動'],
    fire: ['', '開槍！'],
  };
  let lastPhaseKey = '';
  function renderDuel() {
    const d = state.game.duel;
    if (!d) return;
    const sides = [[$('#sideA'), d.a], [$('#sideB'), d.b]];
    const r = d.result;
    for (const [el, p] of sides) {
      el.style.setProperty('--c', p.color);
      el.querySelector('.pname').textContent = p.name;
      el.querySelector('.wins').textContent = `${p.wins} 勝${p.connected ? '' : ' · 離線'}`;
      const st = el.querySelector('.status'), re = el.querySelector('.react'), gun = el.querySelector('.gun');
      gun.style.color = p.color;
      el.classList.remove('winner', 'loser');
      st.className = 'status';
      if (d.phase === 'intro') { st.textContent = ''; re.textContent = ''; gun.classList.remove('holstered'); }
      else if (d.phase === 'holster') { st.textContent = p.holstered ? '✓ 已就位' : '請垂下手機'; if (p.holstered) st.classList.add('ok'); re.textContent = ''; gun.classList.toggle('holstered', p.holstered); }
      else if (d.phase === 'wait') { st.textContent = ''; re.textContent = ''; gun.classList.add('holstered'); }
      else if (d.phase === 'fire') { st.textContent = ''; gun.classList.remove('holstered'); re.innerHTML = p.reaction != null ? `${p.reaction}<small> ms</small>` : ''; }
      else if (d.phase === 'result' && r) {
        gun.classList.remove('holstered');
        const isWinner = r.winner === p.pid, isLoser = r.loser === p.pid;
        if (isWinner) el.classList.add('winner'); else if (isLoser || (r.winner && !isWinner)) el.classList.add('loser');
        re.innerHTML = p.reaction != null ? `${p.reaction}<small> ms</small>` : '';
        if (r.reason === 'falsestart' && isLoser) { st.textContent = '搶跑！'; }
        else if (r.reason === 'holster' && isLoser) st.textContent = '沒就位';
        else if (r.reason === 'left' && !isWinner) st.textContent = '離線';
        else if (r.reason === 'shot' && isLoser) st.textContent = p.reaction != null ? '慢了' : '沒開槍';
        else if (isWinner) { st.textContent = 'WINNER'; st.classList.add('ok'); }
        else st.textContent = '';
      }
    }
    $('#round').textContent = `ROUND ${d.round}`;
    const [big, sub] = PHASE_TEXT[d.phase] || ['', ''];
    $('#big').textContent = big; $('#sub').textContent = sub;
    $('#big').classList.toggle('pulse', d.phase === 'wait');
    $('#vs').classList.toggle('hidden', d.phase !== 'intro');
    if (d.phase === 'wait') { $('#big').textContent = '• • •'; }
    if (d.phase === 'result' && r) {
      const w = r.winner ? (d.a.pid === r.winner ? d.a : d.b) : null;
      $('#big').textContent = w ? `${w.name} 勝！` : '平手';
      const REASON = { shot: '先開槍', falsestart: '對手搶跑', timeout: '沒人開槍，再來一次', left: '對手離線', holster: '對手沒就位' };
      $('#sub').textContent = REASON[r.reason] || '';
      if (!w && r.reason === 'holster') $('#sub').textContent = '兩位都沒就位，再來一次';
    }
    // footer: what happens next
    const champ = state.players.find((p) => p.pid === state.game.champion);
    $('#queue').innerHTML = `結束後回到大廳，輸家會被彈出擂台，想挑戰的人走進去就行。` + (champ ? ` 目前冠軍 <span class="q first" style="--c:${champ.color}">${champ.name}</span>` : '');

    // phase-change sounds
    const key = `${d.round}:${d.phase}:${d.a.holstered}:${d.b.holstered}`;
    if (key !== lastPhaseKey) {
      const prev = lastPhaseKey.split(':');
      if (d.phase === 'intro') sfx.intro();
      else if (d.phase === 'holster' && prev[1] === 'holster' && (d.a.holstered || d.b.holstered)) sfx.holstered();
      else if (d.phase === 'wait') sfx.ready();
      else if (d.phase === 'result' && r) { if (r.winner) sfx.win(); else sfx.fail(); }
      lastPhaseKey = key;
    }
  }

  // ---------- bumper (top-down sumo ring) ----------
  const ring = $('#ring'), rctx = ring.getContext('2d');
  const bumps = [];                 // recent collision sparks
  const trails = new Map();         // pid -> [{x, y, at}]
  let bumperResultKey = '';
  $('#bskipBtn').addEventListener('click', () => cmd('skip'));
  $('#bstopBtn').addEventListener('click', () => cmd('stop'));
  function renderBumper() {
    const b = state.game.bumper;
    const box = ring.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const W = Math.max(1, Math.round(box.width)), H = Math.max(1, Math.round(box.height));
    if (ring.width !== W * dpr || ring.height !== H * dpr) { ring.width = W * dpr; ring.height = H * dpr; }
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const now = Date.now(), t = now / 1000;
    const cx = W / 2, cy = H / 2 + 24;
    const scale = Math.min(W, H - 140) * 0.46 / b.ringRadius;
    const px = (x) => cx + x * scale, py = (y) => cy + y * scale;

    // floor
    const bg = rctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    bg.addColorStop(0, '#1b1538'); bg.addColorStop(1, '#0b0916');
    rctx.fillStyle = bg; rctx.fillRect(0, 0, W, H);
    // outer (original) ring, faint
    rctx.strokeStyle = 'rgba(255,255,255,0.08)'; rctx.lineWidth = 2;
    rctx.beginPath(); rctx.arc(cx, cy, b.ringRadius * scale, 0, Math.PI * 2); rctx.stroke();
    // current ring: wooden dohyo with a danger edge
    const R = b.radius * scale;
    const floor = rctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
    floor.addColorStop(0, '#6b4e2e'); floor.addColorStop(1, '#4a3420');
    rctx.fillStyle = floor; rctx.beginPath(); rctx.arc(cx, cy, R, 0, Math.PI * 2); rctx.fill();
    for (let i = 1; i < 4; i++) { rctx.strokeStyle = 'rgba(0,0,0,0.15)'; rctx.lineWidth = 1; rctx.beginPath(); rctx.arc(cx, cy, R * i / 4, 0, Math.PI * 2); rctx.stroke(); }
    const shrinking = b.radius < b.ringRadius - 0.01;
    rctx.strokeStyle = shrinking ? `rgba(255,82,82,${0.6 + 0.4 * Math.sin(t * 6)})` : '#f3e2b0';
    rctx.lineWidth = 6; rctx.beginPath(); rctx.arc(cx, cy, R, 0, Math.PI * 2); rctx.stroke();

    // sparks
    for (let i = bumps.length - 1; i >= 0; i--) {
      const s = bumps[i], age = (now - s.at) / 350;
      if (age >= 1) { bumps.splice(i, 1); continue; }
      rctx.strokeStyle = `rgba(255,235,130,${1 - age})`; rctx.lineWidth = 3;
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * Math.PI * 2 + s.at % 7, r0 = 6 + age * 26, r1 = r0 + 10 + Math.min(20, (s.force || 0) * 2);
        rctx.beginPath(); rctx.moveTo(px(s.x) + Math.cos(a) * r0, py(s.y) + Math.sin(a) * r0); rctx.lineTo(px(s.x) + Math.cos(a) * r1, py(s.y) + Math.sin(a) * r1); rctx.stroke();
      }
    }

    // bodies: eliminated ones fall away first (drawn under), then the living
    const bodies = [...b.bodies].sort((p, q) => (p.alive === q.alive ? 0 : p.alive ? 1 : -1));
    const r = b.bodyR * scale;
    for (const p of bodies) {
      let x = px(p.x), y = py(p.y), size = 1, alpha = 1;
      if (!p.alive) {
        const age = (now - p.outAt) / 900;
        if (age >= 1) continue;
        size = 1 - age * 0.7; alpha = 1 - age;
        const dir = Math.atan2(p.y, p.x); x += Math.cos(dir) * age * 60; y += Math.sin(dir) * age * 60 + age * age * 120;
      }
      // trail while dashing
      let tr = trails.get(p.pid); if (!tr) { tr = []; trails.set(p.pid, tr); }
      if (p.alive && p.dashing) tr.push({ x, y, at: now });
      while (tr.length && now - tr[0].at > 250) tr.shift();
      for (const q of tr) { const a = 1 - (now - q.at) / 250; rctx.fillStyle = p.color; rctx.globalAlpha = a * 0.35; rctx.beginPath(); rctx.arc(q.x, q.y, r * a, 0, Math.PI * 2); rctx.fill(); }
      rctx.globalAlpha = alpha;
      // shadow + body
      rctx.fillStyle = 'rgba(0,0,0,0.35)'; rctx.beginPath(); rctx.ellipse(x + 3, y + 5, r * size, r * size * 0.9, 0, 0, Math.PI * 2); rctx.fill();
      rctx.fillStyle = p.color; rctx.beginPath(); rctx.arc(x, y, r * size, 0, Math.PI * 2); rctx.fill();
      if (p.dashing) { rctx.strokeStyle = '#fff'; rctx.lineWidth = 4; rctx.stroke(); }
      else if (state.game.champion === p.pid) { rctx.strokeStyle = '#ffd740'; rctx.lineWidth = 3; rctx.stroke(); }
      // eyes look where the stick points
      const fx = p.face.x, fy = p.face.y;
      rctx.fillStyle = '#fff';
      rctx.beginPath(); rctx.arc(x + fx * r * 0.35 - fy * r * 0.3, y + fy * r * 0.35 + fx * r * 0.3, r * 0.22, 0, Math.PI * 2); rctx.fill();
      rctx.beginPath(); rctx.arc(x + fx * r * 0.35 + fy * r * 0.3, y + fy * r * 0.35 - fx * r * 0.3, r * 0.22, 0, Math.PI * 2); rctx.fill();
      rctx.fillStyle = '#111';
      rctx.beginPath(); rctx.arc(x + fx * r * 0.48 - fy * r * 0.3, y + fy * r * 0.48 + fx * r * 0.3, r * 0.11, 0, Math.PI * 2); rctx.fill();
      rctx.beginPath(); rctx.arc(x + fx * r * 0.48 + fy * r * 0.3, y + fy * r * 0.48 - fx * r * 0.3, r * 0.11, 0, Math.PI * 2); rctx.fill();
      // name + dash readiness pip
      rctx.font = '700 14px system-ui, "Noto Sans TC", sans-serif'; rctx.textAlign = 'center'; rctx.textBaseline = 'bottom';
      rctx.fillStyle = 'rgba(0,0,0,0.6)'; rctx.fillText(p.name, x + 1, y - r - 5);
      rctx.fillStyle = '#fff'; rctx.fillText(p.name, x, y - r - 6);
      if (p.alive) { rctx.fillStyle = p.dashReady ? '#ff6e40' : 'rgba(255,255,255,0.2)'; rctx.beginPath(); rctx.arc(x, y + r + 9, 4, 0, Math.PI * 2); rctx.fill(); }
      rctx.globalAlpha = 1;
    }

    // HUD
    $('#bround').textContent = `碰碰車 · ROUND ${b.round}`;
    const tl = Math.ceil(b.timeLeft);
    $('#btime').textContent = b.phase === 'play' ? `${Math.floor(tl / 60)}:${String(tl % 60).padStart(2, '0')}` : '';
    $('#btime').classList.toggle('low', tl <= 10);
    const alive = b.bodies.filter((p) => p.alive).length;
    $('#balive').textContent = `${alive} / ${b.bodies.length} 人還在圈內${shrinking ? ' · 圈在縮小' : ''}`;
    const banner = $('#bbanner');
    if (b.phase === 'ready') {
      const left = Math.ceil((b.readyMs - (now - b.phaseAt)) / 1000);
      banner.classList.remove('hidden'); banner.innerHTML = `${left > 0 ? left : 'GO!'}<small>推人出圈，最後站著的人贏</small>`;
    } else if (b.phase === 'result' && b.result) {
      banner.classList.remove('hidden');
      const w = b.result.winner ? b.bodies.find((p) => p.pid === b.result.winner) : null;
      banner.innerHTML = (w ? `<span style="color:${w.color}">${w.name}</span> 勝！` : '沒有贏家') +
        `<div class="rank">${b.result.names.map((n, i) => `${i + 1}. ${n}`).join('　')}</div>`;
      const key = `${b.round}:${b.result.winner}`;
      if (bumperResultKey !== key) { bumperResultKey = key; if (w) sfx.win(); else sfx.fail(); }
    } else banner.classList.add('hidden');
  }

  // ---------- parkour (side-scrolling course, camera follows the pack) ----------
  const course = $('#course'), cctx = course.getContext('2d');
  const pkSmooth = new Map();
  let pkCam = null, pkScale = null, parkourResultKey = '';
  $('#pskipBtn').addEventListener('click', () => cmd('skip'));
  $('#pstopBtn').addEventListener('click', () => cmd('stop'));
  function renderParkour() {
    const k = state.game.parkour;
    const box = course.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const W = Math.max(1, Math.round(box.width)), H = Math.max(1, Math.round(box.height));
    if (course.width !== W * dpr || course.height !== H * dpr) { course.width = W * dpr; course.height = H * dpr; }
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const now = Date.now(), t = now / 1000;
    // camera: frame every runner still on the course. Zoom out as they spread, up to the whole course.
    const running = k.bodies.filter((b) => b.finishedAt == null);
    const xs = running.length ? running.map((b) => b.pos.x) : [k.finishX];
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const maxScale = (H - 160) / k.course.h, minScale = (W - 40) / k.course.w;
    const wantScale = Math.max(minScale, Math.min(maxScale, (W - 160) / (maxX - minX + 14)));
    pkScale = pkScale == null ? wantScale : pkScale + (wantScale - pkScale) * 0.06;
    const scale = pkScale;
    const viewW = W / scale;
    const target = Math.max(viewW / 2, Math.min(k.course.w - viewW / 2, (minX + maxX) / 2));
    pkCam = pkCam == null ? target : pkCam + (target - pkCam) * 0.08;
    const groundY = H - 110;
    const px = (x) => (x - pkCam + viewW / 2) * scale, py = (y) => groundY - y * scale;

    // sky + parallax hills (same palette as the lobby, so it feels like the same world)
    const sky = cctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0b0f2a'); sky.addColorStop(0.6, '#1a1540'); sky.addColorStop(1, '#2d1b4e');
    cctx.fillStyle = sky; cctx.fillRect(0, 0, W, H);
    for (const s of stars) { cctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 1.5 + s.tw); cctx.fillStyle = '#fff'; cctx.beginPath(); cctx.arc(((s.x * W - pkCam * 4) % W + W) % W, s.y * H, s.r, 0, Math.PI * 2); cctx.fill(); }
    cctx.globalAlpha = 1;
    hills(cctx, W, groundY + 40, 26, 0.006, pkCam * 0.03, '#221a4d', 150);
    hills(cctx, W, groundY + 40, 34, 0.01, 1.7 + pkCam * 0.06, '#2b2160', 90);
    hills(cctx, W, groundY + 40, 20, 0.018, 3.1 + pkCam * 0.1, '#352a70', 40);
    // pit glow below the course
    const pit = cctx.createLinearGradient(0, groundY, 0, H);
    pit.addColorStop(0, 'rgba(255,82,82,0)'); pit.addColorStop(1, 'rgba(255,82,82,0.25)');
    cctx.fillStyle = pit; cctx.fillRect(0, groundY, W, H - groundY);

    // platforms
    const thick = 0.42 * scale;
    for (const pl of k.course.platforms) {
      const x = px(pl.x), y = py(pl.y), w = pl.w * scale;
      if (x + w < -20 || x > W + 20) continue;
      const isGround = pl.y === 0;
      cctx.fillStyle = isGround ? '#3b2d63' : '#4a3a7a';
      cctx.beginPath(); cctx.roundRect(x, y, w, isGround ? H - y : thick, isGround ? [6, 6, 0, 0] : 8); cctx.fill();
      cctx.fillStyle = isGround ? '#8e78d0' : '#a08ae0';
      cctx.beginPath(); cctx.roundRect(x, y, w, 7, isGround ? [6, 6, 0, 0] : [8, 8, 0, 0]); cctx.fill();
    }
    // spikes
    for (const h of k.course.hazards || []) {
      const x = px(h.x), y = py(h.y), w = h.w * scale;
      if (x + w < -20 || x > W + 20) continue;
      const n = Math.max(2, Math.round(h.w / 0.35)), sw = w / n;
      cctx.fillStyle = '#ff5252';
      for (let i = 0; i < n; i++) { cctx.beginPath(); cctx.moveTo(x + i * sw, y); cctx.lineTo(x + (i + 0.5) * sw, y - 0.55 * scale); cctx.lineTo(x + (i + 1) * sw, y); cctx.closePath(); cctx.fill(); }
    }
    // checkpoints (flags) and the finish line
    for (let i = 1; i < k.checkpoints.length; i++) {
      const cx = k.checkpoints[i], x = px(cx);
      if (x < -40 || x > W + 40) continue;
      let top = 0; for (const pl of k.course.platforms) if (cx >= pl.x && cx <= pl.x + pl.w && pl.y > top) top = pl.y;
      const y = py(top);
      cctx.strokeStyle = '#ddd'; cctx.lineWidth = 3; cctx.beginPath(); cctx.moveTo(x, y); cctx.lineTo(x, y - 52); cctx.stroke();
      cctx.fillStyle = '#69f0ae'; cctx.beginPath(); cctx.moveTo(x, y - 52); cctx.lineTo(x + 30, y - 42); cctx.lineTo(x, y - 32); cctx.closePath(); cctx.fill();
    }
    const fx = px(k.finishX);
    if (fx > -80 && fx < W + 80) {
      const y = py(0);
      for (let r = 0; r < 8; r++) for (let c = 0; c < 2; c++) { cctx.fillStyle = (r + c) % 2 ? '#fff' : '#222'; cctx.fillRect(fx + c * 10, y - 90 + r * 10, 10, 10); }
      cctx.fillStyle = '#ffd740'; cctx.font = '900 16px system-ui, "Noto Sans TC", sans-serif'; cctx.textAlign = 'center'; cctx.textBaseline = 'bottom';
      cctx.fillText('FINISH', fx + 10, y - 96);
    }

    // runners
    const bw = 0.8 * scale, bh = 1.0 * scale;
    const sorted = [...k.bodies].sort((a, b) => a.pos.x - b.pos.x);
    for (const p of sorted) {
      let s = pkSmooth.get(p.pid);
      if (!s) { s = { x: p.pos.x, y: p.pos.y }; pkSmooth.set(p.pid, s); }
      s.x += (p.pos.x - s.x) * 0.5; s.y += (p.pos.y - s.y) * 0.5;
      const x = px(s.x), feet = py(s.y);
      // off-screen: edge marker with name
      if (x < -10 || x > W + 10) {
        const ex = x < 0 ? 14 : W - 14;
        cctx.fillStyle = p.color; cctx.beginPath(); cctx.moveTo(ex, feet - 20); cctx.lineTo(ex + (x < 0 ? 14 : -14), feet - 32); cctx.lineTo(ex + (x < 0 ? 14 : -14), feet - 8); cctx.closePath(); cctx.fill();
        cctx.font = '700 12px system-ui, "Noto Sans TC", sans-serif'; cctx.textAlign = x < 0 ? 'left' : 'right'; cctx.textBaseline = 'middle'; cctx.fillStyle = '#fff';
        cctx.fillText(p.name, ex + (x < 0 ? 18 : -18), feet - 20);
        continue;
      }
      let sx = 1, sy = 1;
      const land = (now - p.landedAt) / 180;
      if (land >= 0 && land < 1) { const kk = Math.sin(land * Math.PI); sx = 1 + 0.3 * kk; sy = 1 - 0.3 * kk; }
      else if (!p.onGround && p.vel.y > 3) { sx = 0.88; sy = 1.14; }
      cctx.save();
      cctx.globalAlpha = p.finishedAt != null ? 0.45 : p.respawning ? 0.5 + 0.5 * Math.sin(t * 30) : 1;
      cctx.translate(x, feet); cctx.scale(sx, sy);
      cctx.fillStyle = p.color; cctx.beginPath(); cctx.roundRect(-bw / 2, -bh, bw, bh, bw * 0.45); cctx.fill();
      cctx.fillStyle = 'rgba(0,0,0,0.35)';
      const step = p.onGround && Math.abs(p.vel.x) > 0.5 ? Math.sin(t * 18) * 4 : 0;
      cctx.beginPath(); cctx.roundRect(-bw * 0.4, -5 + step, bw * 0.32, 6, 3); cctx.fill();
      cctx.beginPath(); cctx.roundRect(bw * 0.08, -5 - step, bw * 0.32, 6, 3); cctx.fill();
      const f = p.facing || 1;
      cctx.fillStyle = '#fff'; cctx.beginPath(); cctx.arc(f * 4 - 7, -bh * 0.68, 5, 0, Math.PI * 2); cctx.fill(); cctx.beginPath(); cctx.arc(f * 4 + 7, -bh * 0.68, 5, 0, Math.PI * 2); cctx.fill();
      cctx.fillStyle = '#111'; cctx.beginPath(); cctx.arc(f * 6 - 7, -bh * 0.68, 2.6, 0, Math.PI * 2); cctx.fill(); cctx.beginPath(); cctx.arc(f * 6 + 7, -bh * 0.68, 2.6, 0, Math.PI * 2); cctx.fill();
      cctx.restore();
      cctx.font = '700 14px system-ui, "Noto Sans TC", sans-serif'; cctx.textAlign = 'center'; cctx.textBaseline = 'bottom';
      cctx.fillStyle = 'rgba(0,0,0,0.5)'; cctx.fillText(p.name, x + 1, feet - bh - 6);
      cctx.fillStyle = '#fff'; cctx.fillText(p.name, x, feet - bh - 7);
      if (p.finishedAt != null) { cctx.fillStyle = '#ffd740'; cctx.font = '800 12px system-ui, sans-serif'; cctx.fillText(`${(p.finishedAt / 1000).toFixed(2)}s`, x, feet - bh - 22); }
    }
    for (const pid of pkSmooth.keys()) if (!k.bodies.some((b) => b.pid === pid)) pkSmooth.delete(pid);

    // HUD + progress bar
    $('#pround').textContent = `跑酷 · ROUND ${k.round}`;
    const tl = Math.max(0, k.timeLimit - k.time / 1000);
    $('#ptime').textContent = k.phase === 'play' ? `${(k.time / 1000).toFixed(1)} s` : '';
    $('#ptime').classList.toggle('low', tl <= 10);
    $('#pleft').textContent = `${k.bodies.filter((b) => b.finishedAt != null).length} / ${k.bodies.length} 人到終點`;
    $('#pprogress').innerHTML = k.bodies.map((b) => `<span class="dot" style="left:${Math.min(100, Math.max(0, (b.pos.x - k.startX) / (k.finishX - k.startX) * 100))}%;background:${b.color}" title="${b.name}"></span>`).join('') + '<span class="flag">🏁</span>';
    const banner = $('#pbanner');
    if (k.phase === 'ready') {
      const left = Math.ceil((k.readyMs - (now - k.phaseAt)) / 1000);
      banner.classList.remove('hidden'); banner.innerHTML = `${left > 0 ? left : 'GO!'}<small>衝到終點！</small>`;
    } else if (k.phase === 'result' && k.result) {
      banner.classList.remove('hidden');
      const w = k.result.winner ? k.bodies.find((b) => b.pid === k.result.winner) : null;
      banner.innerHTML = (w ? `<span style="color:${w.color}">${w.name}</span> 第一！` : '沒人到終點') +
        `<div class="rank">${k.result.ranking.map((pid, i) => { const b = k.bodies.find((x) => x.pid === pid); return `${i + 1}. ${b ? b.name : '?'}${b && b.finishedAt != null ? ` ${(b.finishedAt / 1000).toFixed(2)}s` : ''}`; }).join('　')}</div>`;
      const key = `${k.round}:${k.result.winner}`;
      if (parkourResultKey !== key) { parkourResultKey = key; if (w) sfx.win(); else sfx.fail(); }
    } else banner.classList.add('hidden');
  }

  function render() {
    const inDuel = !!state.game.duel;
    const inBumper = !!state.game.bumper;
    const inParkour = !!state.game.parkour;
    $('#lobby').classList.toggle('hidden', inDuel || inBumper || inParkour);
    $('#duel').classList.toggle('hidden', !inDuel);
    $('#bumper').classList.toggle('hidden', !inBumper);
    $('#parkour').classList.toggle('hidden', !inParkour);
    if (inDuel) renderDuel();
    else if (inBumper) renderBumper();
    else if (inParkour) renderParkour();
    else { renderLobby(); lastPhaseKey = ''; bumperResultKey = ''; parkourResultKey = ''; pkCam = null; pkScale = null; trails.clear(); bumps.length = 0; }
    $('#count').textContent = `${state.players.filter((p) => p.connected).length} 位玩家`;
    if (!$('#debug').classList.contains('hidden')) renderDebug();
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // ---------- debug overlay (lobby input viewer) ----------
  const cards = new Map();
  const lastGesture = new Map();
  const KIND_LABEL = { join: '加入', leave: '離線', shake: 'SHAKE', button: '按下', calibrate: '校正', duel: '對決', game: '遊戲', emoji: '' };
  function logEvent(m) {
    const p = state.players.find((x) => x.pid === m.pid);
    const el = document.createElement('div');
    el.className = 'ev';
    const t = new Date().toLocaleTimeString('en-GB');
    el.innerHTML = `<span class="t">${t}</span><span class="p" style="color:${p ? p.color : '#aaa'}">${m.num ? '#' + m.num : ''}</span><span>${KIND_LABEL[m.kind] || m.kind} ${m.detail || ''}</span>`;
    $('#events').prepend(el);
    while ($('#events').children.length > 60) $('#events').lastChild.remove();
  }
  function makeCard(p) {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.setProperty('--c', p.color);
    el.innerHTML = `
      <div class="title"><span class="num">#${p.num}</span><span class="name"></span><span class="hz"></span></div>
      <canvas width="300" height="300"></canvas>
      <div class="info">
        <div class="dir">CENTER</div>
        <div class="gesture"></div>
        <div class="bars">
          <span>x</span><div class="bar ax"><i></i></div>
          <span>y</span><div class="bar ay"><i></i></div>
          <span>z</span><div class="bar az"><i></i></div>
          <span>|a|</span><div class="bar mag"><i></i></div>
        </div>
        <div class="btns"><div class="btn A">A</div><div class="btn B">B</div></div>
      </div>
      <div class="raw"></div>`;
    $('#cards').appendChild(el);
    const c = {
      el, ctx: el.querySelector('canvas').getContext('2d'),
      name: el.querySelector('.name'), hz: el.querySelector('.hz'), dir: el.querySelector('.dir'), gesture: el.querySelector('.gesture'),
      ax: el.querySelector('.ax i'), ay: el.querySelector('.ay i'), az: el.querySelector('.az i'), mag: el.querySelector('.mag i'),
      A: el.querySelector('.btn.A'), B: el.querySelector('.btn.B'), raw: el.querySelector('.raw'),
    };
    cards.set(p.pid, c);
    return c;
  }
  function setBar(el, v, range) {
    const f = Math.max(-1, Math.min(1, v / range));
    el.style.left = f < 0 ? `${50 + f * 50}%` : '50%';
    el.style.width = `${Math.abs(f) * 50}%`;
  }
  function drawPad(ctx, p) {
    const W = 300, cx = 150, cy = 150, R = 120;
    ctx.clearRect(0, 0, W, W);
    ctx.strokeStyle = '#2a2a30'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.25, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
    const x = cx + p.tilt.x * R, y = cy - p.tilt.y * R;
    ctx.strokeStyle = p.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
  }
  function renderDebug() {
    const seen = new Set();
    for (const p of state.players) {
      seen.add(p.pid);
      const c = cards.get(p.pid) || makeCard(p);
      c.el.classList.toggle('off', !p.connected);
      c.name.textContent = p.name;
      c.hz.textContent = p.connected ? `${p.hz} Hz · rtt ${p.rtt == null ? '?' : p.rtt} ms` : 'offline';
      c.dir.textContent = p.tilt.dir;
      c.dir.style.color = p.tilt.dir === 'CENTER' ? '#666' : p.color;
      drawPad(c.ctx, p);
      setBar(c.ax, p.accel.x, 20); setBar(c.ay, p.accel.y, 20); setBar(c.az, p.accel.z, 20);
      c.mag.style.width = `${Math.min(1, p.accel.mag / 30) * 100}%`;
      c.A.classList.toggle('down', p.buttons.A);
      c.B.classList.toggle('down', p.buttons.B);
      if (p.gesture) {
        if (lastGesture.get(p.pid) !== p.gesture) { c.gesture.classList.remove('flashg'); void c.gesture.offsetWidth; c.gesture.classList.add('flashg'); }
        c.gesture.textContent = p.gesture;
      } else c.gesture.textContent = '';
      lastGesture.set(p.pid, p.gesture);
      c.raw.textContent = `α ${p.orient.alpha.toFixed(0).padStart(4)}  β ${p.orient.beta.toFixed(0).padStart(4)}  γ ${p.orient.gamma.toFixed(0).padStart(4)}   tilt ${p.tilt.x.toFixed(2)}, ${p.tilt.y.toFixed(2)}   |a| ${p.accel.mag.toFixed(1)}`;
    }
    for (const [pid, c] of cards) if (!seen.has(pid)) { c.el.remove(); cards.delete(pid); }
  }
})();
</script>
</body>
</html>
